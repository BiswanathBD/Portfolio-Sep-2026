<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="cyanBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="orangeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="35%" stop-color="#F43F5E" />
      <stop offset="70%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Chevron (<) -->
  <path
    d="M 235 68 L 102 188 C 88 200 88 220 102 232 L 208 322"
    stroke="url(#cyanBlue)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Chevron (>) -->
  <path
    d="M 292 178 L 398 268 C 412 280 412 300 398 312 L 265 432"
    stroke="url(#orangeRed)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Middle Slash (/) -->
  <!-- Subtle border / outline -->
  <line
    x1="300" y1="68"
    x2="200" y2="432"
    stroke="rgba(192, 132, 252, 0.45)"
    stroke-width="46"
    stroke-linecap="round"
  />
  <!-- White core bar -->
  <line
    x1="300" y1="68"
    x2="200" y2="432"
    stroke="#FFFFFF"
    stroke-width="42"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />
</svg>
